<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BlitzBid | Register</title>
    <link rel="stylesheet" href="./css/style.css" />
    <!-- Google fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:opsz@14..32&family=Jersey+20&family=Zilla+Slab+Highlight&family=Zilla+Slab:ital@0;1&display=swap"
      rel="stylesheet"
    />
    <!-- FontAwesome -->
    <script
      src="https://kit.fontawesome.com/4b71fec88a.js"
      crossorigin="anonymous"
    ></script>
  </head>
  <body class="bg-brand-200 flex min-h-screen flex-col">
    <header
      class="flex h-25 items-center justify-between bg-white px-8"
    ></header>
    <main
      class="font-heading mt-6 flex flex-1 flex-col items-center tracking-wider"
    >
      <img
        src="assets/cd_half.png"
        alt="Shiny compact disc"
        class="h-21 w-auto"
      />
      <h1 class="mt-3 text-3xl uppercase">Register account</h1>
      <form
        id="registration-form"
        novalidate
        class="mt-10 flex w-full flex-1 flex-col text-center md:w-auto"
      >
        <div class="md:flex md:w-200 md:flex-row md:gap-20">
          <div class="flex flex-col gap-1">
            <label for="email" class="text-2xl">Email</label>
            <input
              type="email"
              name="email"
              id="email"
              required
              class="focus:border-brand-500 font-default w-80 self-center border border-gray-400 bg-white p-3"
            />
            <div class="error"></div>
            <label for="password" class="text-2xl">Password</label>
            <input
              type="password"
              name="password"
              id="password"
              required
              minlength="8"
              class="focus:border-brand-500 font-default w-80 self-center border border-gray-400 bg-white p-3"
            />
            <div class="error"></div>
            <label for="confirm-password" class="text-2xl"
              >Repeat password</label
            >
            <input
              type="password"
              name="confirm-password"
              id="confirm-password"
              required
              minlength="8"
              class="focus:border-brand-500 font-default w-80 self-center border border-gray-400 bg-white p-3"
            />
            <div class="error"></div>
          </div>
          <div
            class="text-brand-500 mt-8 mb-8 h-0.5 w-full bg-[repeating-linear-gradient(to_right,currentColor_0_10px,transparent_10px_20px)] md:h-[200px] md:w-5 md:bg-[repeating-linear-gradient(to_bottom,currentColor_0_10px,transparent_10px_20px)]"
          ></div>
          <div class="flex flex-col gap-1">
            <label for="avatar" class="text-2xl">Avatar</label>
            <input
              type="url"
              name="avatar"
              id="avatar"
              placeholder="URL"
              class="focus:border-brand-500 font-default w-80 self-center border border-gray-400 bg-white p-3"
            />
            <div class="error"></div>
            <label for="name" class="text-2xl">Name</label>
            <input
              type="text"
              name="name"
              id="name"
              required
              minlength="2"
              maxlength="30"
              class="focus:border-brand-500 font-default w-80 self-center border border-gray-400 bg-white p-3"
            />
            <div class="error"></div>
            <label for="bio" class="text-2xl">Bio</label>
            <input
              type="text"
              name="bio"
              id="bio"
              required
              minlength="5"
              maxlength="160"
              class="focus:border-brand-500 font-default w-80 self-center border border-gray-400 bg-white p-3"
            />
            <div class="error pb-7"></div>
          </div>
        </div>
        <div class="mt-auto flex flex-col md:w-80 md:self-center md:pb-6">
          <button type="submit" id="register" class="btn-primary !p-5">
            Register
          </button>
          <a href="login.html" class="text-brand-500 p-5 text-3xl uppercase"
            >Back</a
          >
        </div>
      </form>
    </main>
    <footer></footer>
    <div id="popup-backdrop" class="hidden"></div>
    <section
      id="popup"
      class="hidden"
      role="dialog"
      aria-modal="true"
      aria-labelledby="popup-message"
    >
      <div id="popup-message"></div>
      <div id="popup-actions"></div>
    </section>
  </body>
  <script type="module" src="js/pages/registration.js"></script>
</html>
