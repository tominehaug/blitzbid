<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BlitzBid | Home</title>
    <link rel="stylesheet" href="css/style.css" />
    <!-- Google fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:opsz@14..32&family=Jersey+20&family=Zilla+Slab+Highlight&family=Zilla+Slab:ital@0;1&display=swap"
      rel="stylesheet"
    />
    <!-- FontAwesome -->
    <script
      src="https://kit.fontawesome.com/4b71fec88a.js"
      crossorigin="anonymous"
    ></script>
  </head>
  <body class="bg-brand-200 font-default">
    <header
      class="sticky top-0 z-50 flex h-[100px] items-center justify-between bg-white px-8"
    ></header>
    <div class="relative mt-8 mb-8">
      <img
        src="assets/cd.png"
        alt="Shiny compact disc"
        class="block w-[200px] md:w-[310px] h-auto mx-auto"
      />
      <p
        class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 -rotate-15 whitespace-nowrap text-xl md:text-3xl font-styled"
      >
        Music doesn't
        <span class="font-styled-special text-2xl md:text-4xl"
          >just belong</span
        >
        in your playlist.
      </p>
    </div>
    <div class="text-center max-w-xs mx-auto">
      <h2 class="font-heading text-2xl">Browse categories</h2>
      <div
        class="mt-1 flex flex-wrap justify-center gap-2 text-xl [&>a:nth-child(3n+1)]:border-2 [&>a:nth-child(3n+1)]:border-dashed"
      >
        <a href="" class="px-1">Picture discs</a>
        <a href="" class="p-1">Casette tapes</a>
        <a href="" class="p-1">Posters</a>
        <a href="" class="p-1">Vinyl records</a>
        <a href="" class="p-1">CDs</a>
        <button id="load-categories" class="hover:text-decoration-line mt-3">
          load more
        </button>
      </div>
    </div>
    <a href="#browse"><h1>Go crate digging</h1></a>
    <main id="browse" class="scroll-mt-[110px]">
      <div>
        <h2>Popular listings</h2>
      </div>
      <div>
        <h2>
          <p>What makes us worth the bid?</p>
        </h2>
        <ul>
          <li>Curated selection</li>
          <li>Transparency and trust</li>
          <li>Unique and rare items</li>
        </ul>
      </div>
      <div>
        <h2>Recently added</h2>
        <h2>Ending soon</h2>
      </div>
    </main>
    <footer></footer>
    <div id="popup-backdrop" class="hidden"></div>
    <section id="popup" class="hidden" role="dialog" aria-modal="true">
      <div id="popup-message"></div>
      <div id="popup-actions"></div>
    </section>
  </body>
  <script type="module" src="js/pages/home-page.js"></script>
</html>
