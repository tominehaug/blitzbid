<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BlitzBid | Home</title>
    <link rel="stylesheet" href="css/style.css" />
    <!-- Google fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:opsz@14..32&family=Jersey+20&family=Zilla+Slab+Highlight&family=Zilla+Slab:ital@0;1&display=swap"
      rel="stylesheet"
    />
    <!-- FontAwesome -->
    <script
      src="https://kit.fontawesome.com/4b71fec88a.js"
      crossorigin="anonymous"
    ></script>
  </head>
  <body class="bg-brand-200 font-default">
    <header
      class="sticky top-0 z-50 flex h-25 items-center justify-between bg-white px-8"
    ></header>
    <div id="search"></div>
    <div class="relative mt-8 mb-8">
      <img
        src="assets/cd.png"
        alt="Shiny compact disc"
        class="mx-auto block h-auto w-50 md:w-77.5"
      />
      <p
        class="font-styled absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 -rotate-15 text-xl whitespace-nowrap md:text-3xl"
      >
        Music doesn't
        <span class="font-styled-special text-2xl md:text-4xl"
          >just belong</span
        >
        in your playlist
      </p>
    </div>
    <div class="mx-auto max-w-xs text-center">
      <h2 class="font-heading text-2xl">Browse categories</h2>
      <div
        class="mt-1 flex flex-wrap justify-center gap-4 text-xl [&>a:nth-child(3n+1)]:border-2 [&>a:nth-child(3n+1)]:border-dashed"
      >
        <a href="" class="border-2 p-1">Picture discs</a>
        <a href="" class="border-2 p-1">Casette tapes</a>
        <a href="" class="border-2 p-1">Posters</a>
        <a href="" class="border-2 p-1">Vinyl records</a>
        <a href="" class="border-2 p-1">CDs</a>
        <button id="load-categories" class="text-lg underline">
          load more
        </button>
      </div>
    </div>
    <a
      href="#browse"
      class="mx-auto mt-14 flex w-fit flex-row items-center gap-3"
      ><img
        src="assets/fast-forward.svg"
        alt="forward-arrow"
        width="40"
        height="60" />
      <h1 class="font-heading text-4xl">Go crate digging</h1>
      <img
        src="assets/fast-forward.svg"
        alt="Fast forward-arrow"
        width="40"
        height="60"
    /></a>
    <main id="browse" class="mb-5 scroll-mt-[110px]">
      <section id="popular-carousel" class="relative m-3 pt-5">
        <h2 class="font-heading mb-2 text-2xl">Popular listings</h2>
        <button
          type="button"
          class="js-prev bg-brand-200 absolute top-50 left-0 p-2"
        >
          <img src="assets/prev.svg" alt="back-arrow" width="20" height="40" />
        </button>
        <div class="js-slides-container"></div>
        <button
          type="button"
          class="js-next bg-brand-200 absolute top-50 right-0 p-2"
        >
          <img
            src="assets/next.svg"
            alt="forward-arrow"
            width="20"
            height="40"
          />
        </button>
        <div class="mt-5 flex justify-center gap-2 md:hidden">
          <span
            class="js-dot inline-block h-3 w-3 cursor-pointer bg-gray-700"
          ></span>
          <span
            class="js-dot inline-block h-3 w-3 cursor-pointer bg-gray-400"
          ></span>
          <span
            class="js-dot inline-block h-3 w-3 cursor-pointer bg-gray-400"
          ></span>
          <span
            class="js-dot inline-block h-3 w-3 cursor-pointer bg-gray-400"
          ></span>
        </div>
      </section>
      <section>
        <div
          class="text-brand-500 mt-8 mb-8 h-0.5 w-full bg-[repeating-linear-gradient(to_right,currentColor_0_10px,transparent_10px_20px)] md:w-[450px] md:rotate-90"
        ></div>
        <h2 class="font-styled mx-auto max-w-3xs text-center text-3xl">
          <span class="font-styled-special text-6xl">What</span> makes us worth
          the bid <span class="font-styled-special text-6xl">?</span>
        </h2>
        <ul class="font-heading mt-5 flex flex-col gap-4 text-2xl">
          <li class="w-2xs self-end bg-white p-3 text-left">
            Curated selection
          </li>
          <li class="w-2xs self-start bg-white p-3 text-right">
            Transparency and trust
          </li>
          <li class="w-2xs self-end bg-white p-3 text-left">
            Unique and rare items
          </li>
        </ul>
      </section>
      <div
        class="text-brand-500 mt-8 mb-4 h-0.5 w-full bg-[repeating-linear-gradient(to_right,currentColor_0_10px,transparent_10px_20px)]"
      ></div>
      <section id="recent-carousel" class="relative m-3 mb-10">
        <div class="sm-hidden bg-[url(assets/turnarm.png)]"></div>
        <h2 class="font-heading mb-2 text-2xl">Recently added</h2>
        <button
          type="button"
          class="js-prev bg-brand-200 absolute top-50 left-0 p-2"
        >
          <img src="assets/prev.svg" alt="back-arrow" width="20" height="40" />
        </button>
        <div class="js-slides-container"></div>
        <button
          type="button"
          class="js-next bg-brand-200 absolute top-50 right-0 p-2"
        >
          <img
            src="assets/next.svg"
            alt="forward-arrow"
            width="20"
            height="40"
          />
        </button>
        <div class="mt-5 flex justify-center gap-2 md:hidden">
          <span
            class="js-dot inline-block h-3 w-3 cursor-pointer bg-gray-700"
          ></span>
          <span
            class="js-dot inline-block h-3 w-3 cursor-pointer bg-gray-400"
          ></span>
          <span
            class="js-dot inline-block h-3 w-3 cursor-pointer bg-gray-400"
          ></span>
        </div>
      </section>
      <section id="ending-carousel" class="relative m-3">
        <h2 class="font-heading mb-2 text-right text-2xl">Ending soon</h2>
        <button
          type="button"
          class="js-prev bg-brand-200 absolute top-50 left-0 p-2"
        >
          <img src="assets/prev.svg" alt="back-arrow" width="20" height="40" />
        </button>
        <div class="js-slides-container"></div>
        <button
          type="button"
          class="js-next bg-brand-200 absolute top-50 right-0 p-2"
        >
          <img
            src="assets/next.svg"
            alt="forward-arrow"
            width="20"
            height="40"
          />
        </button>
        <div class="mt-5 flex justify-center gap-2 md:hidden">
          <span
            class="js-dot inline-block h-3 w-3 cursor-pointer bg-gray-700"
          ></span>
          <span
            class="js-dot inline-block h-3 w-3 cursor-pointer bg-gray-400"
          ></span>
          <span
            class="js-dot inline-block h-3 w-3 cursor-pointer bg-gray-400"
          ></span>
        </div>
      </section>
    </main>
    <footer class="bg-white p-3"></footer>
    <div id="popup-backdrop" class="hidden"></div>
    <section id="popup" class="hidden" role="dialog" aria-modal="true">
      <div id="popup-message"></div>
      <div id="popup-actions"></div>
    </section>
  </body>
  <script type="module" src="js/pages/home-page.js"></script>
</html>
