<!doctype html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BlitzBid | Home</title>
    <link rel="stylesheet" href="css/style.css" />
    <!-- Google fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:opsz@14..32&family=Jersey+20&family=Zilla+Slab+Highlight&family=Zilla+Slab:ital@0;1&display=swap"
      rel="stylesheet"
    />
    <!-- FontAwesome -->
    <script
      src="https://kit.fontawesome.com/4b71fec88a.js"
      crossorigin="anonymous"
    ></script>
  </head>
  <body class="bg-brand-200 font-default">
    <header
      class="sticky top-0 z-10 flex h-24 items-center justify-between bg-white px-8"
    >
      <span
        class="bg-brand-200 border-brand-500 font-heading shrink-0 rounded-b-lg border pt-1 pr-3 pb-1 pl-3 text-2xl"
      >
        € 9999
      </span>
    </header>
    <section class="flex min-h-[calc(100dvh-6.25rem)] flex-col">
      <div
        class="md:grid md:grid-cols-2 md:grid-rows-2 md:justify-items-center md:gap-8 lg:mt-8 lg:grid-cols-7 lg:grid-rows-3"
      >
        <form
          id="search-form"
          class="mx-4 mt-4 flex h-10 flex-row justify-between bg-white p-2 md:col-start-2 md:row-start-1 md:mx-0 md:mt-0 md:w-80 md:self-end lg:col-span-2 lg:col-start-5 lg:row-span-1"
        >
          <label for="search-input" class="hidden">Search for auctions</label>
          <input
            id="search-input"
            type="search"
            placeholder="eg. Vinyl, Rock..."
            class="mr-2 flex-1"
          />
          <button type="submit">
            <i class="fa-solid fa-magnifying-glass"></i>
          </button>
        </form>
        <div
          class="relative mt-8 mb-8 self-center md:col-start-1 md:row-span-2 md:mt-0 md:mb-0 lg:col-span-2 lg:col-start-2 lg:row-span-3 lg:row-start-1"
        >
          <img
            src="assets/cd.png"
            alt="Shiny compact disc"
            class="mx-auto block h-auto w-50 lg:w-77.5"
          />
          <p
            class="font-styled absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 -rotate-15 text-lg whitespace-nowrap lg:text-3xl"
          >
            Music doesn't
            <span class="font-styled-special bg-white text-[22px] lg:text-4xl"
              >just belong</span
            >
            in your playlist
          </p>
        </div>
        <div
          class="mx-auto max-w-xs text-center md:col-start-2 md:row-start-2 md:mx-0 md:w-full md:self-start lg:col-span-2 lg:col-start-5 lg:row-span-2"
        >
          <h2 class="font-heading text-2xl">Browse categories</h2>
          <div
            id="tag-container"
            class="mt-1 flex flex-wrap justify-center gap-4 text-xl [&>a:nth-child(3n+1)]:border-2 [&>a:nth-child(3n+1)]:border-dashed"
          ></div>
          <button
            id="shuffle-categories"
            class="mt-4 text-lg uppercase underline"
          >
            Shuffle
          </button>
        </div>
      </div>
      <a
        href="#browse"
        class="mx-auto mt-auto flex w-fit flex-row items-center gap-3 pb-7"
        ><img
          src="assets/fast-forward.svg"
          alt="forward-arrow"
          width="40"
          height="60" />
        <h1 class="font-heading text-4xl">Go crate digging</h1>
        <img
          src="assets/fast-forward.svg"
          alt="Fast forward-arrow"
          width="40"
          height="60"
      /></a>
    </section>
    <main id="browse" class="mb-5 scroll-mt-27">
      <div
        class="lg:z-5 lg:flex lg:w-full lg:flex-row-reverse lg:justify-end lg:gap-20"
      >
        <section
          id="popular-carousel"
          class="relative m-3 pt-5 md:flex md:flex-col md:items-center lg:items-start"
        >
          <h2 class="font-heading mb-2 text-2xl">Popular listings</h2>
          <button
            type="button"
            class="js-prev bg-brand-200 absolute top-1/2 left-0 -translate-y-1/2 p-2 md:hidden"
          >
            <img
              src="assets/prev.svg"
              alt="back-arrow"
              width="20"
              height="40"
            />
          </button>
          <div
            class="js-slides-container md:flex md:flex-row md:flex-wrap md:gap-4 lg:z-5 lg:max-w-200 md:[&>.js-link-wrap]:!block"
          ></div>
          <button
            type="button"
            class="js-next bg-brand-200 absolute top-1/2 right-0 -translate-y-1/2 p-2 md:hidden"
          >
            <img
              src="assets/next.svg"
              alt="forward-arrow"
              width="20"
              height="40"
            />
          </button>
          <div class="mt-5 flex justify-center gap-2 md:hidden">
            <span
              class="js-dot inline-block h-3 w-3 cursor-pointer bg-gray-700"
            ></span>
            <span
              class="js-dot inline-block h-3 w-3 cursor-pointer bg-gray-400"
            ></span>
            <span
              class="js-dot inline-block h-3 w-3 cursor-pointer bg-gray-400"
            ></span>
            <span
              class="js-dot inline-block h-3 w-3 cursor-pointer bg-gray-400"
            ></span>
          </div>
        </section>
        <div
          class="text-brand-500 mt-8 mb-4 h-0.5 w-full bg-[repeating-linear-gradient(to_right,currentColor_0_10px,transparent_10px_20px)] lg:hidden"
        ></div>
        <section
          class="border-r-brand-500 border-r-2 border-dashed lg:mt-10 lg:self-start"
        >
          <h2 class="font-styled mx-auto max-w-3xs text-center text-3xl">
            <span class="font-styled-special text-6xl">What</span> makes us
            worth the bid <span class="font-styled-special text-6xl">?</span>
          </h2>
          <ul class="font-heading mt-5 flex flex-col gap-4 text-2xl lg:pb-5">
            <li class="w-[70vw] self-end bg-white p-3 text-left lg:w-100">
              Curated selection
            </li>
            <li class="w-[70vw] self-start bg-white p-3 text-right lg:w-100">
              Transparency and trust
            </li>
            <li class="w-[70vw] self-end bg-white p-3 text-left lg:w-100">
              Unique and rare items
            </li>
          </ul>
        </section>
      </div>
      <div
        class="text-brand-500 mt-8 mb-8 h-0.5 w-full bg-[repeating-linear-gradient(to_right,currentColor_0_10px,transparent_10px_20px)] lg:hidden"
      ></div>
      <section
        id="recent-carousel"
        class="relative z-0 m-3 mb-10 lg:mx-4 lg:my-0"
      >
        <div class="hidden -rotate-15 lg:absolute lg:top-0 lg:right-0 lg:block">
          <img src="assets/turnarm.png" alt="" />
        </div>
        <div class="lg:relative lg:z-5 lg:pt-70">
          <h2 class="font-heading mb-2 text-2xl">Recently added</h2>
          <button
            type="button"
            class="js-prev bg-brand-200 absolute top-1/2 left-0 -translate-y-1/2 p-2 md:hidden"
          >
            <img
              src="assets/prev.svg"
              alt="back-arrow"
              width="20"
              height="40"
            />
          </button>
          <div
            class="js-slides-container md:flex md:flex-row md:flex-wrap md:gap-4 md:[&>.js-link-wrap]:!block"
          ></div>
          <button
            type="button"
            class="js-next bg-brand-200 absolute top-1/2 right-0 -translate-y-1/2 p-2 md:hidden"
          >
            <img
              src="assets/next.svg"
              alt="forward-arrow"
              width="20"
              height="40"
            />
          </button>
        </div>
        <div class="mt-5 flex justify-center gap-2 md:hidden">
          <span
            class="js-dot inline-block h-3 w-3 cursor-pointer bg-gray-700"
          ></span>
          <span
            class="js-dot inline-block h-3 w-3 cursor-pointer bg-gray-400"
          ></span>
          <span
            class="js-dot inline-block h-3 w-3 cursor-pointer bg-gray-400"
          ></span>
        </div>
      </section>
      <section
        id="ending-carousel"
        class="relative m-3 md:flex md:flex-col md:items-end"
      >
        <h2 class="font-heading mb-2 text-right text-2xl">Ending soon</h2>
        <button
          type="button"
          class="js-prev bg-brand-200 absolute top-1/2 left-0 -translate-y-1/2 p-2 md:hidden"
        >
          <img src="assets/prev.svg" alt="back-arrow" width="20" height="40" />
        </button>
        <div
          class="js-slides-container md:flex md:flex-row md:flex-wrap md:gap-4 md:[&>.js-link-wrap]:!block"
        ></div>
        <button
          type="button"
          class="js-next bg-brand-200 absolute top-1/2 right-0 -translate-y-1/2 p-2 md:hidden"
        >
          <img
            src="assets/next.svg"
            alt="forward-arrow"
            width="20"
            height="40"
          />
        </button>
        <div class="mt-5 flex justify-center gap-2 md:hidden">
          <span
            class="js-dot inline-block h-3 w-3 cursor-pointer bg-gray-700"
          ></span>
          <span
            class="js-dot inline-block h-3 w-3 cursor-pointer bg-gray-400"
          ></span>
          <span
            class="js-dot inline-block h-3 w-3 cursor-pointer bg-gray-400"
          ></span>
        </div>
      </section>
    </main>
    <footer class="bg-white p-3"></footer>
    <div
      id="popup-backdrop"
      class="fixed inset-0 z-40 hidden bg-white/70"
    ></div>
    <section
      id="popup"
      class="fixed inset-0 z-50 flex hidden items-center justify-center"
      role="dialog"
      aria-modal="true"
    >
      <div
        id="popup-box"
        class="mx-3 flex w-full flex-col items-center justify-center rounded-sm border-3 bg-white px-10 py-5 text-center md:w-80"
      >
        <div
          id="popup-message"
          class="font-default text-lg font-semibold"
        ></div>
        <div id="popup-actions" class="popup-actions"></div>
      </div>
    </section>
    <script type="module" src="js/pages/home-page.js"></script>
  </body>
</html>
