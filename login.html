<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BlitzBid | Login</title>
    <link rel="stylesheet" href="css/style.css" />
    <script
      src="https://kit.fontawesome.com/4b71fec88a.js"
      crossorigin="anonymous"
    ></script>
  </head>
  <body class="bg-brand-200">
    <header
      class="sticky top-0 z-50 flex h-25 items-center justify-between bg-white px-8"
    ></header>
    <main class="font-heading">
      <img src="assets/cd_half.png" alt="Shiny compact disc" class="" />
      <h1 class="uppercase">Log in</h1>
      <form id="login-form" novalidate>
        <label for="email">E-mail</label>
        <input type="email" name="email" id="email" required />
        <div class="error"></div>
        <br />
        <label for="password">Password</label>
        <input
          type="password"
          name="password"
          id="password"
          required
          minlength="8"
        />
        <div class="error"></div>
        <div>
          <button type="submit" id="signin" class="primary-button">
            Sign in
          </button>
          <button id="signup">
            <a href="register.html">Sign up</a>
          </button>
          <button><a href="index.html">Back</a></button>
        </div>
      </form>
    </main>
    <footer></footer>
    <div id="popup-backdrop" class="hidden"></div>
    <section id="popup" class="hidden" role="dialog" aria-modal="true">
      <div id="popup-message"></div>
      <div id="popup-actions"></div>
    </section>
  </body>
  <script type="module" src="js/pages/login.js"></script>
</html>
