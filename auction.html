<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BlitzBid | Auction</title>
    <link rel="stylesheet" href="./css/style.css" />
    <!-- Google fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:opsz@14..32&family=Jersey+20&family=Zilla+Slab+Highlight&family=Zilla+Slab:ital@0;1&display=swap"
      rel="stylesheet"
    />
    <!-- FontAwesome -->
    <script
      src="https://kit.fontawesome.com/4b71fec88a.js"
      crossorigin="anonymous"
    ></script>
  </head>
  <body>
    <header
      class="flex h-24 items-center justify-between bg-white px-8"
    ></header>
    <main
      class="md:mx-10 md:grid md:grid-cols-4 md:gap-6 lg:mx-10 lg:grid-cols-3 lg:gap-[4vw]"
    >
      <div class="md:col-span-2 lg:col-span-1">
        <div id="auction-gallery" class="flex flex-col gap-2">
          <img
            src=""
            alt=""
            id="auction-media"
            class="max-h-100 w-full object-cover md:max-h-full"
          />
          <div
            id="media-thumbnails"
            class="flex flex-row gap-2 overflow-x-auto"
          ></div>
        </div>
      </div>
      <div class="md:col-span-2 lg:col-span-1">
        <div class="mx-4 mt-4">
          <h1 id="title" class="font-heading text-2xl"></h1>
          <h2 class="italic">Description</h2>
          <div id="description"></div>
        </div>
        <a
          id="seller-link"
          class="font-heading mt-8 mr-4 flex h-20 flex-row justify-end gap-2"
        >
          <div class="flex flex-col items-end justify-end">
            <p class="text-xl text-gray-500">Seller:</p>
            <p id="seller-name" class="text-2xl"></p>
          </div>
          <img src="" alt="" id="seller-img" />
        </a>
        <div
          id="tag-container"
          class="bg-brand-200 mt-4 flex w-full flex-wrap justify-center gap-4 px-4 py-5 text-xl [&>a:nth-child(3n+1)]:border-2 [&>a:nth-child(3n+1)]:border-dashed"
        ></div>
      </div>
      <div class="md:col-span-2 md:col-start-3 lg:col-span-1 lg:col-start-auto">
        <div class="items-left mt-4 flex w-full flex-col gap-3">
          <div
            class="font-heading text-error self-center text-2xl lg:ml-4 lg:self-start"
          >
            Deadline: 8/13/2026
          </div>
          <form id="bid-form" class="w-full">
            <label
              for="bid"
              class="mx-4 mb-4 flex flex-row items-center gap-2 md:mx-0"
            >
              <input
                type="number"
                id="bid"
                name="bid"
                placeholder="200"
                required
                max="9999"
                class="focus:border-brand-500 font-heading w-full border border-gray-400 bg-white p-3 text-2xl focus:border-2 focus:ring-0 focus:outline-none"
              />
              <i class="fa-solid fa-euro-sign text-4xl"></i>
              <error
                class="text-error font-default mx-2 mt-1 text-base"
              ></error>
            </label>
            <button id="bid-btn" type="submit" class="btn-primary w-full !py-5">
              Place your bid
            </button>
          </form>
        </div>
        <div class="mx-4 mt-4 md:mx-0">
          <h2 class="font-heading text-2xl">Bid history</h2>
          <div id="bid-list" class="flex flex-col gap-3"></div>
        </div>
      </div>
    </main>
    <div
      class="text-brand-500 mt-8 mb-4 h-0.5 w-full bg-[repeating-linear-gradient(to_right,currentColor_0_10px,transparent_10px_20px)]"
    ></div>
    <footer class="bg-white p-3"></footer>
    <div
      id="popup-backdrop"
      class="fixed inset-0 z-40 hidden bg-white/70"
    ></div>
    <section
      id="popup"
      class="fixed inset-0 z-50 flex hidden items-center justify-center"
      role="dialog"
      aria-modal="true"
    >
      <div
        id="popup-box"
        class="mx-3 flex w-full flex-col items-center justify-center rounded-sm border-3 bg-white px-10 py-5 text-center md:w-80"
      >
        <div
          id="popup-message"
          class="font-default text-lg font-semibold"
        ></div>
        <div id="popup-actions" class="popup-actions"></div>
      </div>
    </section>
    <script type="module" src="js/pages/auction.js"></script>
  </body>
</html>
