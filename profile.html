<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Profile | BlitzBid</title>
    <link rel="stylesheet" href="css/style.css" />
    <!-- Google fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:opsz@14..32&family=Jersey+20&family=Zilla+Slab+Highlight&family=Zilla+Slab:ital@0;1&display=swap"
      rel="stylesheet"
    />
    <!-- FontAwesome -->
    <script
      src="https://kit.fontawesome.com/4b71fec88a.js"
      crossorigin="anonymous"
    ></script>
  </head>
  <body class="bg-brand-200 font-default">
    <div class="flex flex-col min-h-dvh">
    <header
      class="sticky top-0 z-10 flex h-25 items-center justify-between bg-white px-4"
    ></header>
    <main class="flex flex-1 flex-col z-0">
      <div id="banner" class="relative h-12 md:h-60">
        <img src="" alt="" id="profile-banner" class="hidden md:block object-cover w-full h-full absolute inset-0" />
        <button class="js-back absolute top-2 left-2 z-10">
          <img src="assets/prev.svg" alt="back-arrow" width="20" height="40" />
        </button>
      </div>
      <div class="flex flex-col md:flex-row md:items-start md:gap-15 md:px-4">
        <section id="profile-details" class="flex flex-col items-center md:items-start gap-3 w-full md:w-80 md:shrink-0">
          <img src="" alt="" id="profile-img" class="max-w-[160px] rounded-full object-contain relative z-20 md:-mt-12" />
          <div class="flex flex-row gap-2">
            <h1 id="profile-name" class="font-heading text-3xl tracking-wider"></h1>
            <i class="fa-solid fa-pen-to-square text-3xl"></i>
          </div>
          <p id="profile-bio" class="font-default text-lg text-center md:text-left mb-2"></p>
          <button id="new-listing" class="btn-primary w-full !py-4">New listing</button>
        </section>
        <div class="flex flex-col gap-4">
          <div class="mt-8 w-full flex flex-row gap-20 justify-center md:justify-start">
            <i class="fa-solid fa-bars rotate-90 text-4xl" id="my-listings"></i>
            <i class="fa-solid fa-hand text-4xl" id="my-bids"></i>
            <i class="fa-solid fa-money-check-dollar text-4xl" id="credits"></i>
          </div>
          <section id="tab-content"></section>
        </div>
      </div>
    </main>
    <footer class="bg-white p-3"></footer>
    <div
      id="popup-backdrop"
      class="fixed inset-0 z-40 hidden bg-white/70"
    ></div>
    <section
      id="popup"
      class="fixed inset-0 z-50 flex hidden items-center justify-center"
      role="dialog"
      aria-modal="true"
    >
      <div
        id="popup-box"
        class="mx-3 flex w-full flex-col items-center justify-center rounded-sm border-3 bg-white px-10 py-5 text-center md:w-80"
      >
        <div
          id="popup-message"
          class="font-default text-lg font-semibold"
        ></div>
        <div id="popup-actions" class="popup-actions"></div>
      </div>
    </section>
  </body>
  <script type="module" src="js/pages/profile.js"></script>
</html>
