<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Profile | BlitzBid</title>
    <link rel="stylesheet" href="css/style.css" />
    <!-- Google fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:opsz@14..32&family=Jersey+20&family=Zilla+Slab+Highlight&family=Zilla+Slab:ital@0;1&display=swap"
      rel="stylesheet"
    />
    <!-- FontAwesome -->
    <script
      src="https://kit.fontawesome.com/4b71fec88a.js"
      crossorigin="anonymous"
    ></script>
  </head>
  <body class="bg-brand-200 font-default">
    <div class="flex flex-col min-h-dvh">
    <header
      class="sticky top-0 z-10 flex h-25 items-center justify-between bg-white px-8"
    ></header>
    <main class="flex flex-1 flex-col">
      <a href="" class="js-back">
        <img src="assets/prev.svg" alt="back-arrow" width="20" height="40" />
      </a>
    <section id="profile-details">
      <img src="" alt="" id="profile-banner" class="md:hidden" />
      <img src="" alt="" id="profile-img" />
      <h1 id="profile-name"></h1>
      <button>
        <i class="fa-solid fa-pen-to-square"></i>
      </button>
      <p id="profile-bio"></p>
      <button id="new-listing" class="btn-primary w-full">New listing</button>
    </section>
    <div>
      <i class="fa-solid fa-bars rotate-90 text-4xl"></i>
      <i class="fa-solid fa-hand text-4xl"></i>
      <i class="fa-solid fa-money-check-dollar text-4xl"></i>
    </div>
    <section id="my-listings"></section>
    </main>
    <footer class="bg-white p-3"></footer>
    <div
      id="popup-backdrop"
      class="fixed inset-0 z-40 hidden bg-white/70"
    ></div>
    <section
      id="popup"
      class="fixed inset-0 z-50 flex hidden items-center justify-center"
      role="dialog"
      aria-modal="true"
    >
      <div
        id="popup-box"
        class="mx-3 flex w-full flex-col items-center justify-center rounded-sm border-3 bg-white px-10 py-5 text-center md:w-80"
      >
        <div
          id="popup-message"
          class="font-default text-lg font-semibold"
        ></div>
        <div id="popup-actions" class="popup-actions"></div>
      </div>
    </section>
  </body>
  <script type="module" src="js/pages/profile.js"></script>
</html>
