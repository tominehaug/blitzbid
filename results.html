<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BlitzBid | Results</title>
    <link rel="stylesheet" href="css/style.css" />
    <!-- Google fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:opsz@14..32&family=Jersey+20&family=Zilla+Slab+Highlight&family=Zilla+Slab:ital@0;1&display=swap"
      rel="stylesheet"
    />
    <!-- FontAwesome -->
    <script
      src="https://kit.fontawesome.com/4b71fec88a.js"
      crossorigin="anonymous"
    ></script>
  </head>
  <body class="bg-brand-200 font-default">
    <header
      class="sticky top-0 z-10 flex h-25 items-center justify-between bg-white px-8"
    ></header>
    <main class="min-h-[calc(100vh-25)] md:mx-auto md:max-w-200">
      <form
        id="search-form"
        class="mx-4 mt-4 flex flex-row justify-between bg-white p-2 md:w-80"
      >
        <label for="search-input" class="hidden">Search for auctions</label>
        <input
          id="search-input"
          type="search"
          placeholder="eg. Vinyl, Rock..."
          class="mr-2 flex-1"
        />
        <button type="submit">
          <i class="fa-solid fa-magnifying-glass"></i>
        </button>
      </form>
      <h1 class="font-heading mt-4 ml-4 text-2xl">Results</h1>
      <div id="results" class="md:flex md:flex-row md:flex-wrap"></div>
    </main>
    <footer class="bg-white p-3"></footer>
    <div
      id="popup-backdrop"
      class="fixed inset-0 z-40 hidden bg-white/70"
    ></div>
    <section
      id="popup"
      class="fixed inset-0 z-50 flex hidden items-center justify-center"
      role="dialog"
      aria-modal="true"
    >
      <div
        id="popup-box"
        class="mx-3 flex w-full flex-col items-center justify-center rounded-sm border-3 bg-white px-10 py-5 text-center md:w-80"
      >
        <div
          id="popup-message"
          class="font-default text-lg font-semibold"
        ></div>
        <div id="popup-actions" class="popup-actions"></div>
      </div>
    </section>
    <script type="module" src="js/pages/results.js"></script>
  </body>
</html>
